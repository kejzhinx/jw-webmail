<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" fill="none">
  <!-- EMBLEM -->
  <g id="jw-emblem" transform="translate(10, 12) scale(0.31)">
    <!-- Top Left Black Block -->
    <rect x="80" y="125" width="220" height="300" fill="#1A1A1A" />

    <!-- Orange U-Shape (Left lower block + bottom curve + taller middle stem) -->
    <path
      d="M 80,495
         L 80,590
         C 80,785 230,875 415,875
         C 600,875 715,785 715,590
         L 715,80
         L 465,80
         L 465,590
         C 465,650 445,690 400,690
         C 355,690 300,650 300,590
         L 300,495
         Z"
      fill="#F15A24"
    />

    <!-- Right Black J-Hook -->
    <path
      d="M 790,125
         L 1010,125
         L 1010,590
         C 1010,795 875,895 620,895
         C 730,865 815,790 815,680
         L 790,680
         L 790,125
         Z"
      fill="#1A1A1A"
    />
  </g>

  <!-- VERTICAL DIVIDER BAR -->
  <line
    x1="390"
    y1="25"
    x2="390"
    y2="295"
    stroke="#1A1A1A"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- TYPOGRAPHY -->
  <!-- Top Line: JW SUMMIT in Corporate Orange -->
  <text
    x="440"
    y="150"
    fill="#F15A24"
    font-family="'Montserrat', 'Arial Black', 'Helvetica Neue', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="132"
    letter-spacing="0.02em"
  >
    JW SUMMIT
  </text>

  <!-- Bottom Line: GROUP INC. with period in Solid Black -->
  <text
    x="445"
    y="260"
    fill="#1A1A1A"
    font-family="'Montserrat', 'Arial Black', 'Helvetica Neue', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="72"
    letter-spacing="0.285em"
  >
    GROUP INC.
  </text>
</svg>
